name: Abella Web OAuth Worker

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: support/oauth-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: support/oauth-worker

      - name: Type check
        run: npm run check
        working-directory: support/oauth-worker

      - name: Unit tests
        run: npm test
        working-directory: support/oauth-worker
