name: Abella Web

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Binaryen 120
        run: |
          BASE=https://github.com/WebAssembly/binaryen/releases/download
          curl -fsSL -o /tmp/binaryen.tar.gz \
            "$BASE/version_120/binaryen-version_120-x86_64-linux.tar.gz"
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-version_120/bin" >> "$GITHUB_PATH"

      - name: Use OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Install OCaml dependencies
        run: |
          opam install . --deps-only --with-test
          opam install \
            js_of_ocaml-ppx.6.4.1 \
            wasm_of_ocaml-compiler.6.4.1 \
            --assume-depexts

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: support/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: support

      - name: TypeScript check
        run: npm run check
        working-directory: support

      - name: Unit tests
        run: npm run web:test
        working-directory: support

      - name: Build web
        run: opam exec -- make web

      - name: Check single-engine artifacts
        run: |
          test -f web/abella_js/worker.js
          test -f web/abella_js/abella_js.bc.wasm.js
          test -d web/abella_js/abella_js.bc.wasm.assets
          test ! -e web/abella_worker.js
          test ! -e web/abella_js.js
          test ! -e web/engine.json

      - name: Check for retired engine references
        run: |
          if git grep -nE 'ENGINE=js|engine\.json|abella_worker|abella_js\.js|web:worker-js|loadEngine|__ENGINE__' -- src support README_Web.md .gitignore; then
            echo "Retired js-engine references remain." >&2
            exit 1
          fi

      - name: Check bundle size
        run: npm run web:size
        working-directory: support
