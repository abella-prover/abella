<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Abella Web</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="abella_web.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="" width="64" height="29">
        <h1>Abella Web</h1>
      </div>
      <div class="topbar-controls">
        <label class="example-picker">
          <span class="visually-hidden">Example</span>
          <select id="example-select" disabled>
            <option>Loading examples…</option>
          </select>
        </label>
        <button id="scratch" type="button">Start from scratch</button>
        <button
          id="sidebar-mobile-toggle"
          class="mobile-only"
          type="button"
          aria-controls="sidebar"
        >Project</button>
        <div class="topbar-actions">
          <button id="download-zip" type="button">Download zip</button>
          <button id="import-zip" type="button">Import zip</button>
          <button
            id="settings"
            class="icon-button"
            type="button"
            aria-label="Settings"
            title="Settings"
            aria-haspopup="dialog"
            aria-controls="settings-dialog"
          ><span aria-hidden="true">⚙</span></button>
          <input id="zip-input" type="file" accept=".zip" hidden>
        </div>
      </div>
    </header>

    <div class="toolbar actions">
      <button id="process-all" type="button">Process full</button>
      <button id="stop" type="button" disabled>Stop</button>
      <button id="reset" type="button">Reset</button>
      <span class="spacer"></span>
      <span id="status-detail" class="status-detail"></span>
      <span id="status" class="status" role="status" aria-live="polite" data-status="idle">Starting…</span>
    </div>

    <main class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Project files">
        <div class="sidebar-title">Project</div>
        <div id="file-list" class="file-list" aria-label="Project files"></div>
        <div class="file-actions" role="group" aria-label="Project file actions">
          <button id="add-file" type="button">+ File</button>
          <button id="rename-file" type="button" disabled>Rename</button>
          <button id="delete-file" type="button" disabled>Delete</button>
          <button id="set-root" type="button" disabled>Set root</button>
        </div>
      </aside>
      <div
        id="sidebar-splitter"
        class="splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize or collapse the project sidebar"
        aria-valuemin="0"
        aria-valuenow="224"
        tabindex="0"
        title="Drag to resize; drag far left or double-click to collapse"
      ></div>
      <section class="editor-pane">
        <div id="editor" class="editor"></div>
      </section>
      <section class="panels">
        <section class="panel">
          <h2>Goal</h2>
          <div id="goal" class="goal-panel"></div>
          <details id="output-disclosure" class="output-disclosure">
            <summary id="output-summary">Warnings and output</summary>
            <div id="output" class="output-panel" role="log" aria-live="polite"></div>
          </details>
        </section>
      </section>
    </main>

    <footer class="footer">
      <span><kbd>Ctrl</kbd>/<kbd>Cmd</kbd>+<kbd>Enter</kbd> check to cursor</span>
      <span><kbd>Ctrl</kbd>+<kbd>]</kbd> / <kbd>[</kbd> next / previous command</span>
      <span><kbd>Ctrl</kbd>+<kbd>.</kbd> jump to checked tip</span>
      <a href="https://abella-prover.org">abella-prover.org</a>
    </footer>

    <dialog
      id="settings-dialog"
      class="settings-dialog"
      aria-labelledby="settings-title"
    >
      <form method="dialog" class="settings-form">
        <div class="settings-head">
          <h2 id="settings-title">Settings</h2>
          <button class="icon-button" type="submit" aria-label="Close settings">×</button>
        </div>
        <label class="setting">
          <span>Dark mode</span>
          <input id="theme-toggle" type="checkbox" role="switch">
        </label>
        <p class="setting-note">Preferences are saved in this browser.</p>
      </form>
    </dialog>

    <script type="module" src="abella_web.js"></script>
  </body>
</html>
