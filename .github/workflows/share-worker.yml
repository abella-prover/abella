name: Abella Web ZIP Worker

on:
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: support/share-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: support/share-worker

      - name: Type check
        run: npm run check
        working-directory: support/share-worker

      - name: Unit tests
        run: npm test
        working-directory: support/share-worker
